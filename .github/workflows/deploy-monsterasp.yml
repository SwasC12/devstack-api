# Builds the API and deploys it to MonsterASP.NET via Web Deploy on every push
# to main. All credentials come from GitHub repository Secrets — nothing
# sensitive lives in this file or in the repo.
name: Deploy to MonsterASP

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you trigger a deploy manually from the Actions tab

jobs:
  build-and-deploy:
    # Web Deploy (msdeploy) is a Windows tool, so we deploy from a Windows runner.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish WebService
        run: dotnet publish DevStack.API.WebService/DevStack.API.WebService.csproj -c Release -o published

      # Swap the local LocalDB connection string for the real MonsterASP one,
      # pulled from a secret. Keeps the prod connection string out of git.
      - name: Inject production connection string
        shell: pwsh
        run: |
          $path = "published/appsettings.json"
          $json = Get-Content $path -Raw | ConvertFrom-Json
          $json.ConnectionStrings.DefaultConnection = "${{ secrets.MONSTER_DB_CONNECTION }}"
          $json | ConvertTo-Json -Depth 10 | Set-Content $path

      - name: Deploy via Web Deploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.MONSTER_WEBSITE_NAME }}
          server-computer-name: ${{ secrets.MONSTER_SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.MONSTER_USERNAME }}
          server-password: ${{ secrets.MONSTER_PASSWORD }}
          source-path: 'published\'
