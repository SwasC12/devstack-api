# Builds the API and deploys it to MonsterASP.NET via FTP on every push to main.
# All credentials come from GitHub repository Secrets Ã¢â‚¬â€ nothing sensitive lives
# in this file or in the repo.
name: Deploy to MonsterASP

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you trigger a deploy manually from the Actions tab

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.MONSTER_SERVER_COMPUTER_NAME }} # site81936.siteasp.net
      FTP_USER: ${{ secrets.MONSTER_USERNAME }}             # site81936
      FTP_PASS: ${{ secrets.MONSTER_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Publish for win-x86 to match MonsterASP's 32-bit app pool. This produces
      # the Windows .exe launcher + a correct web.config (framework-dependent, so
      # it relies on the .NET 10 runtime already installed on MonsterASP).
      - name: Publish WebService (win-x86)
        run: dotnet publish DevStack.API.WebService/DevStack.API.WebService.csproj -c Release -r win-x86 --self-contained false -o published

      # Swap the local LocalDB connection string for the real MonsterASP one,
      # pulled from a secret. Keeps the prod connection string out of git.
      # Build the connection string HERE from fixed, non-secret parts (server,
      # db, user are not sensitive) + the password from a secret. This way the
      # only thing in a secret is the raw password Ã¢â‚¬â€ no keywords/spaces to get
      # wrong. Password read via env var so special characters can't break parsing.
      - name: Inject production connection string
        shell: pwsh
        env:
          DB_PASSWORD: ${{ secrets.MONSTER_DB_PASSWORD }}
          JWT_KEY: ${{ secrets.MONSTER_JWT_KEY }}
          CLOUDINARY_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          OPS_KEY: ${{ secrets.OPS_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          $path = "published/appsettings.json"
          $json = Get-Content $path -Raw | ConvertFrom-Json
          $json.ConnectionStrings.DefaultConnection = "Server=db61580.databaseasp.net;Database=db61580;Uid=db61580;Pwd=$env:DB_PASSWORD;Encrypt=False;TrustServerCertificate=True;MultipleActiveResultSets=True;"
          # Jwt:Key Ã¢â‚¬â€ if a MONSTER_JWT_KEY secret exists, use it; otherwise keep
          # the committed dev key (works, but set the secret before real tenants).
          if ($env:JWT_KEY) { $json.Jwt.Key = $env:JWT_KEY }
          # Cloudinary admin credentials Ã¢â‚¬â€ REQUIRED for server-side image cleanup
          # (deleting a menu item destroys its Cloudinary image). Without them
          # the destroy call silently no-ops. Set the secrets, not values in git.
          if ($env:CLOUDINARY_KEY) { $json.Cloudinary.ApiKey = $env:CLOUDINARY_KEY }
          if ($env:CLOUDINARY_SECRET) { $json.Cloudinary.ApiSecret = $env:CLOUDINARY_SECRET }
          # Ops key Ã¢â‚¬â€ guards POST /api/auth/superadmin-reset, the recovery hatch
          # for a lost superadmin password. Without it the endpoint returns 503.
          if ($env:OPS_KEY) { $json.Ops.Key = $env:OPS_KEY }
          # Firebase service account JSON - lets the API send FCM pushes to
          # owners' devices (superadmin broadcasts). Without it pushes are
          # skipped; in-app notifications still work.
          if ($env:FIREBASE_SERVICE_ACCOUNT) { $json.Firebase.ServiceAccountJson = $env:FIREBASE_SERVICE_ACCOUNT }
          $json | ConvertTo-Json -Depth 10 | Set-Content $path
          Write-Host "Password length seen by workflow:" $env:DB_PASSWORD.Length
          Write-Host "JWT key injected:" [bool]$env:JWT_KEY
          Write-Host "Cloudinary creds injected:" ([bool]$env:CLOUDINARY_KEY -and [bool]$env:CLOUDINARY_SECRET)
          Write-Host "Ops key injected:" [bool]$env:OPS_KEY
          Write-Host "Firebase service account injected:" [bool]$env:FIREBASE_SERVICE_ACCOUNT

      # Turn on ASP.NET Core Module stdout logging + detailed errors so any
      # startup crash writes a readable reason to /wwwroot/logs/ (viewable over FTP)
      # instead of silently resetting the connection.
      - name: Enable startup crash logging
        shell: pwsh
        run: |
          $path = "published/web.config"
          [xml]$xml = Get-Content $path
          $ancm = $xml.SelectSingleNode('//aspNetCore')
          $ancm.SetAttribute('stdoutLogEnabled', 'true')
          $ancm.SetAttribute('stdoutLogFile', '.\logs\stdout')
          $ev = $ancm.SelectSingleNode('environmentVariables')
          if (-not $ev) {
            $ev = $xml.CreateElement('environmentVariables')
            $ancm.AppendChild($ev) | Out-Null
          }
          $var = $xml.CreateElement('environmentVariable')
          $var.SetAttribute('name', 'ASPNETCORE_DETAILEDERRORS')
          $var.SetAttribute('value', 'true')
          $ev.AppendChild($var) | Out-Null
          $xml.Save((Resolve-Path $path))
          New-Item -ItemType Directory -Force -Path published/logs | Out-Null
          Get-Content $path

      # Drop app_offline.htm so IIS/ANCM cleanly stops the app and releases its
      # locks on native DLLs (e.g. Microsoft.Data.SqlClient.SNI.dll) Ã¢â‚¬â€ otherwise
      # FTP overwrite fails with "550 ... GetHandle: failure".
      - name: Take app offline
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          printf '<html><body>Deploying, back shortly.</body></html>' > app_offline.htm
          lftp -e "set ssl:verify-certificate no; set ftp:ssl-allow true; put -O /wwwroot app_offline.htm; bye" -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
          sleep 10

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.MONSTER_SERVER_COMPUTER_NAME }}
          username: ${{ secrets.MONSTER_USERNAME }}
          password: ${{ secrets.MONSTER_PASSWORD }}
          local-dir: ./published/
          server-dir: /wwwroot/
          # Don't let the sync delete app_offline.htm; we remove it ourselves next.
          exclude: |
            **/app_offline.htm

      # Remove app_offline.htm to bring the app back up. `always()` so the site
      # never gets stranded offline even if the deploy step failed.
      - name: Bring app online
        if: always()
        run: |
          command -v lftp >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq lftp)
          lftp -e "set ssl:verify-certificate no; set ftp:ssl-allow true; rm -f /wwwroot/app_offline.htm; bye" -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
