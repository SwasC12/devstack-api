# Builds the API and deploys it to MonsterASP.NET via FTP on every push to main.
# All credentials come from GitHub repository Secrets — nothing sensitive lives
# in this file or in the repo.
name: Deploy to MonsterASP

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you trigger a deploy manually from the Actions tab

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Publish for win-x86 to match MonsterASP's 32-bit app pool. This produces
      # the Windows .exe launcher + a correct web.config (framework-dependent, so
      # it relies on the .NET 10 runtime already installed on MonsterASP).
      - name: Publish WebService (win-x86)
        run: dotnet publish DevStack.API.WebService/DevStack.API.WebService.csproj -c Release -r win-x86 --self-contained false -o published

      # Swap the local LocalDB connection string for the real MonsterASP one,
      # pulled from a secret. Keeps the prod connection string out of git.
      - name: Inject production connection string
        shell: pwsh
        run: |
          $path = "published/appsettings.json"
          $json = Get-Content $path -Raw | ConvertFrom-Json
          $json.ConnectionStrings.DefaultConnection = "${{ secrets.MONSTER_DB_CONNECTION }}"
          $json | ConvertTo-Json -Depth 10 | Set-Content $path

      # Turn on ASP.NET Core Module stdout logging + detailed errors so any
      # startup crash writes a readable reason to /wwwroot/logs/ (viewable over FTP)
      # instead of silently resetting the connection.
      - name: Enable startup crash logging
        shell: pwsh
        run: |
          $path = "published/web.config"
          [xml]$xml = Get-Content $path
          # Find <aspNetCore> by XPath so it works whether or not it's nested
          # inside a <location> element (the modern SDK wraps it in one).
          $ancm = $xml.SelectSingleNode('//aspNetCore')
          $ancm.SetAttribute('stdoutLogEnabled', 'true')
          $ancm.SetAttribute('stdoutLogFile', '.\logs\stdout')
          $ev = $ancm.SelectSingleNode('environmentVariables')
          if (-not $ev) {
            $ev = $xml.CreateElement('environmentVariables')
            $ancm.AppendChild($ev) | Out-Null
          }
          $var = $xml.CreateElement('environmentVariable')
          $var.SetAttribute('name', 'ASPNETCORE_DETAILEDERRORS')
          $var.SetAttribute('value', 'true')
          $ev.AppendChild($var) | Out-Null
          $xml.Save((Resolve-Path $path))
          New-Item -ItemType Directory -Force -Path published/logs | Out-Null
          Get-Content $path

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.MONSTER_SERVER_COMPUTER_NAME }} # site81936.siteasp.net
          username: ${{ secrets.MONSTER_USERNAME }}           # site81936
          password: ${{ secrets.MONSTER_PASSWORD }}
          local-dir: ./published/
          server-dir: /wwwroot/
